<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta http-equiv="Cache-Control" content="no-cache,must-revalidate">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='28' font-size='28'>✨</text></svg>">
<title>星空物语</title>
<style>
:root{
  --bg:#05051a;
  --surface:rgba(16,14,42,.94);
  --text:#ebe8f6;
  --sub:#9a95b8;
  --gold:#e8a0d4;
  --gold-bright:#ffb3d9;
  --img-glow:#d4a0e8;
  --safe-b:env(safe-area-inset-bottom,16px);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
  background:var(--bg);overflow:hidden;height:100dvh;width:100vw;position:fixed;
  -webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;
  -webkit-font-smoothing:antialiased;
}
canvas{display:block;position:fixed;top:0;left:0;width:100%;height:100%}

/* ─── Badge ─── */
.badge{position:fixed;top:max(20px,env(safe-area-inset-top,20px));left:16px;z-index:9;font-size:10px;color:rgba(255,255,255,.18);letter-spacing:2px}

/* ─── Hint ─── */
.hint{position:fixed;bottom:calc(130px + var(--safe-b));left:50%;transform:translateX(-50%);color:rgba(255,255,255,.22);font-size:11px;letter-spacing:2px;pointer-events:none;transition:opacity .5s;z-index:5;text-align:center;line-height:1.7}

/* ─── FAB ─── */
.fab{position:fixed;bottom:calc(96px + var(--safe-b));right:20px;z-index:12;width:50px;height:50px;border-radius:50%;border:none;background:linear-gradient(135deg,#e8a0d4,#c060b0);color:#1a1020;font-size:26px;cursor:pointer;box-shadow:0 8px 30px rgba(220,140,200,.42),0 0 0 2px rgba(255,255,255,.06);display:flex;align-items:center;justify-content:center;transition:transform .25s,box-shadow .25s,background .25s;line-height:1}
.fab:active{transform:scale(.9)}
.fab.active{background:linear-gradient(135deg,#ffb3d9,#e8a0d4);box-shadow:0 0 0 4px rgba(255,180,210,.5),0 14px 44px rgba(220,140,200,.75);animation:pulse-fab 1.2s ease-in-out infinite}
@keyframes pulse-fab{0%,100%{box-shadow:0 0 0 4px rgba(255,180,210,.5),0 14px 44px rgba(220,140,200,.75)}50%{box-shadow:0 0 0 10px rgba(255,180,210,.3),0 18px 52px rgba(220,140,200,.9)}}
.fab-label{position:fixed;bottom:calc(104px + var(--safe-b));right:78px;z-index:12;color:var(--text);font-size:11px;letter-spacing:1px;background:var(--surface);padding:5px 12px;border-radius:12px;opacity:0;pointer-events:none;transform:translateX(6px);transition:opacity .3s,transform .3s;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);box-shadow:0 4px 16px rgba(0,0,0,.45);white-space:nowrap}
.fab-label.show{opacity:1;transform:translateX(0)}

/* ─── Input bar ─── */
.input-bar{position:fixed;bottom:calc(28px + var(--safe-b));left:50%;transform:translateX(-50%) translateY(20px);background:var(--surface);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border-radius:20px;padding:8px;box-shadow:0 12px 48px rgba(0,0,0,.6),0 0 0 1px rgba(255,255,255,.05);opacity:0;pointer-events:none;transition:opacity .35s,transform .35s cubic-bezier(.16,1,.3,1);z-index:14;width:min(94vw,400px);display:flex;flex-direction:column;gap:6px}
.input-bar.active{opacity:1;pointer-events:auto;transform:translateX(-50%) translateY(0)}
.input-row{display:flex;gap:6px;align-items:center}
.input-row input{flex:1;min-width:0;background:transparent;border:none;color:var(--text);font-size:15px;outline:none;font-family:inherit;padding:4px 6px}
.input-row input::placeholder{color:var(--sub)}
.input-row .act-btn{width:36px;height:36px;border-radius:50%;border:none;font-size:15px;cursor:pointer;flex-shrink:0;transition:.2s;display:flex;align-items:center;justify-content:center}
.input-row .send-btn{background:var(--gold);color:#1a1020}
.input-row .send-btn:active{transform:scale(.9)}
.input-row .photo-btn{background:rgba(255,255,255,.06);color:var(--text)}
.input-row .photo-btn:active{transform:scale(.9)}
.input-row .cancel-btn{background:transparent;color:var(--sub);font-size:13px}
/* Image preview */
.img-preview{display:none;position:relative;width:70px;height:70px;border-radius:10px;overflow:hidden;flex-shrink:0}
.img-preview.show{display:block}
.img-preview img{width:100%;height:100%;object-fit:cover}
.img-preview .rm-img{position:absolute;top:2px;right:2px;width:20px;height:20px;border-radius:50%;border:none;background:rgba(0,0,0,.65);color:#fff;font-size:11px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.img-preview .loading-overlay{position:absolute;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;font-size:20px;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* ─── Place indicator ─── */
.place-indicator{position:fixed;pointer-events:none;z-index:13;width:28px;height:28px;transform:translate(-50%,-50%) scale(0);transition:transform .3s cubic-bezier(.16,1,.3,1)}
.place-indicator.show{transform:translate(-50%,-50%) scale(1)}
.place-indicator::before{content:'';position:absolute;top:50%;left:50%;width:28px;height:28px;border:1.5px dashed rgba(255,180,210,.45);border-radius:50%;transform:translate(-50%,-50%);animation:ind-rotate 3s linear infinite}
.place-indicator::after{content:'';position:absolute;top:50%;left:50%;width:5px;height:5px;background:var(--gold-bright);border-radius:50%;transform:translate(-50%,-50%);box-shadow:0 0 16px var(--gold-bright),0 0 32px rgba(255,160,200,.5)}
@keyframes ind-rotate{from{transform:translate(-50%,-50%) rotate(0deg)}to{transform:translate(-50%,-50%) rotate(360deg)}}

/* ─── Star popup ─── */
.star-popup{position:fixed;z-index:22;background:var(--surface);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border-radius:18px;padding:14px 16px;box-shadow:0 12px 48px rgba(0,0,0,.6),0 0 0 1px rgba(255,255,255,.05);opacity:0;pointer-events:none;transform:translate(-50%,-50%) scale(.85);transition:opacity .25s,transform .25s cubic-bezier(.16,1,.3,1);max-width:min(300px,88vw);text-align:center}
.star-popup.show{opacity:1;pointer-events:auto;transform:translate(-50%,-50%) scale(1)}
.star-popup .msg{font-size:14px;color:var(--text);line-height:1.6;word-break:break-word}
.star-popup .popup-img{margin-top:10px;border-radius:10px;max-width:100%;max-height:200px;object-fit:contain;cursor:pointer;display:none}
.star-popup .popup-img.show{display:block}
.star-popup .time{font-size:10px;color:var(--sub);margin-top:10px}
.star-popup .close-popup{position:absolute;top:4px;right:8px;background:none;border:none;color:var(--sub);cursor:pointer;font-size:15px;padding:6px}

/* ─── Full image overlay ─── */
.img-full{position:fixed;inset:0;z-index:46;background:rgba(0,0,0,.92);display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .3s}
.img-full.show{opacity:1;pointer-events:auto}
.img-full img{max-width:95vw;max-height:90dvh;object-fit:contain;border-radius:8px;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.img-full .close-full{position:absolute;top:max(20px,env(safe-area-inset-top,20px));right:16px;width:36px;height:36px;border-radius:50%;border:none;background:rgba(255,255,255,.1);color:#fff;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center}

/* ─── Panel ─── */
.list-panel{position:fixed;right:0;top:0;bottom:0;width:min(320px,88vw);background:var(--surface);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);z-index:32;transform:translateX(100%);transition:transform .4s cubic-bezier(.16,1,.3,1);padding:max(24px,env(safe-area-inset-top,24px)) 16px max(24px,env(safe-area-inset-bottom,24px));overflow-y:auto;-webkit-overflow-scrolling:touch;display:flex;flex-direction:column;gap:8px;box-shadow:-8px 0 40px rgba(0,0,0,.4)}
.list-panel.open{transform:translateX(0)}
.list-panel h3{font-size:15px;color:var(--text);margin-bottom:2px;font-weight:700}
.list-panel .subtitle{font-size:11px;color:var(--sub);margin-bottom:8px}
.list-panel .star-card{background:rgba(255,255,255,.03);border-radius:12px;padding:10px 12px;border:1px solid rgba(255,255,255,.04)}
.list-panel .star-card .card-msg{font-size:13px;color:var(--text);line-height:1.5}
.list-panel .star-card .card-img{margin-top:8px;border-radius:8px;max-width:100%;max-height:120px;object-fit:cover;display:none}
.list-panel .star-card .card-img.show{display:block}
.list-panel .star-card .card-time{font-size:10px;color:var(--sub);margin-top:4px}
.list-panel .star-card .card-del{font-size:10px;color:#c06060;background:none;border:none;cursor:pointer;margin-top:6px;padding:2px 0}
.list-panel .empty{text-align:center;color:var(--sub);padding:36px 16px;font-size:12px;line-height:1.8}
.close-panel{position:absolute;top:max(14px,env(safe-area-inset-top,14px));right:14px;width:30px;height:30px;border-radius:50%;border:none;background:rgba(255,255,255,.06);color:var(--text);cursor:pointer;font-size:15px;display:flex;align-items:center;justify-content:center}

/* ─── Corner ─── */
.corner-btns{position:fixed;top:max(18px,env(safe-area-inset-top,18px));right:14px;display:flex;gap:5px;z-index:9}
.corner-btn{width:36px;height:36px;border-radius:50%;border:none;background:var(--surface);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);color:var(--text);font-size:15px;cursor:pointer;box-shadow:0 4px 20px rgba(0,0,0,.35),0 0 0 1px rgba(255,255,255,.04);display:flex;align-items:center;justify-content:center;transition:.2s}
.corner-btn:active{transform:scale(.9)}

/* ─── Notification ─── */
.notification{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);color:var(--gold);font-size:14px;letter-spacing:2px;pointer-events:none;z-index:28;opacity:0;transition:opacity .5s;text-shadow:0 0 30px var(--gold-bright)}

/* ─── Overlay ─── */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:28;opacity:0;pointer-events:none;transition:opacity .3s}
.overlay.show{opacity:1;pointer-events:auto}

/* ─── Token setup ─── */
.token-setup{position:fixed;inset:0;z-index:44;display:flex;align-items:center;justify-content:center;background:rgba(3,3,14,.9);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);opacity:0;pointer-events:none;transition:opacity .4s}
.token-setup.show{opacity:1;pointer-events:auto}
.token-card{background:var(--surface);border-radius:22px;padding:28px 22px;max-width:350px;width:92%;text-align:center;box-shadow:0 20px 70px rgba(0,0,0,.7),0 0 0 1px rgba(255,255,255,.04)}
.token-card .t-icon{font-size:48px;margin-bottom:12px}
.token-card h2{font-size:18px;color:var(--text);margin-bottom:6px;font-weight:700}
.token-card p{font-size:12px;color:var(--sub);margin-bottom:4px;line-height:1.6}
.token-card input{width:100%;padding:11px 12px;border:1.5px solid rgba(255,255,255,.08);border-radius:10px;font-size:12px;background:rgba(255,255,255,.03);color:var(--text);outline:none;font-family:'SF Mono','Cascadia Code','Consolas',monospace;margin:12px 0 8px;transition:.2s}
.token-card input:focus{border-color:var(--gold)}
.token-card .btn-connect{width:100%;padding:11px;border:none;border-radius:10px;background:var(--gold);color:#1a1020;font-size:14px;font-weight:600;cursor:pointer;transition:.2s;letter-spacing:2px}
.token-card .btn-connect:active{transform:scale(.97)}
.token-card .btn-connect:disabled{opacity:.5}
.token-card .t-err{font-size:11px;color:#e06060;margin-top:6px;min-height:16px}

/* ─── Toast ─── */
.toast{position:fixed;top:max(16px,env(safe-area-inset-top,16px));left:50%;transform:translateX(-50%);background:rgba(22,22,44,.96);color:#fff;padding:8px 20px;border-radius:16px;font-size:12px;z-index:99;opacity:0;pointer-events:none;transition:opacity .3s;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.toast.show{opacity:1}

/* ─── Hidden file input ─── */
#fileInput{display:none}

@media(min-width:600px){
  .hint{font-size:13px;bottom:calc(140px + var(--safe-b))}
  .fab{bottom:calc(106px + var(--safe-b));right:24px;width:50px;height:50px;font-size:26px}
  .fab-label{bottom:calc(114px + var(--safe-b));right:82px;font-size:12px}
  .input-bar{bottom:calc(36px + var(--safe-b));border-radius:22px;padding:8px}
  .input-row input{font-size:16px}
}
</style>
</head>
<body>

<canvas id="sky"></canvas>
<div class="badge" id="badge"></div>
<div class="hint" id="hint">点击星星看留言 · 按 + 留下新星</div>

<button class="fab" id="fab">+</button>
<div class="fab-label" id="fabLabel">点天空放星</div>

<input type="file" id="fileInput" accept="image/*">

<div class="place-indicator" id="indicator"></div>

<div class="input-bar" id="inputBar">
  <div class="input-row">
    <button class="act-btn photo-btn" id="photoBtn">📷</button>
    <input type="text" id="msgInput" placeholder="写一句话..." maxlength="80">
    <button class="act-btn cancel-btn" id="cancelBtn">✕</button>
    <button class="act-btn send-btn" id="sendBtn">✦</button>
  </div>
  <div class="img-preview" id="imgPreview">
    <img id="imgPreviewImg" src="" alt="">
    <button class="rm-img" id="rmImg">✕</button>
    <div class="loading-overlay" id="imgLoading" style="display:none">⟳</div>
  </div>
</div>

<div class="star-popup" id="starPopup">
  <button class="close-popup" id="closePopup">✕</button>
  <div class="msg" id="popupMsg"></div>
  <img class="popup-img" id="popupImg" src="" alt="" loading="lazy">
  <div class="time" id="popupTime"></div>
</div>

<div class="corner-btns">
  <button class="corner-btn" id="daynightBtn" title="切换白天/黑夜">☀</button>
  <button class="corner-btn" id="settingsBtn">⚙</button>
  <button class="corner-btn" id="listBtn">✦</button>
</div>

<div class="overlay" id="overlay"></div>
<div class="list-panel" id="listPanel">
  <button class="close-panel" id="closePanel">✕</button>
  <h3>✦ 所有星光</h3>
  <div class="subtitle" id="panelSubtitle"></div>
  <div id="starCards"></div>
</div>

<div class="notification" id="notification"></div>

<div class="token-setup" id="tokenSetup">
  <div class="token-card">
    <div class="t-icon">🌌</div>
    <h2>连接星空</h2>
    <p>输入 GitHub Token 来连接你们共享的星空</p>
    <p style="font-size:10px;color:rgba(255,255,255,.16)">Token 仅保存在你的浏览器中</p>
    <input type="password" id="tokenInput" placeholder="ghp_xxxxxxxxxxxxxxxxxxxx">
    <button class="btn-connect" id="btnConnect">✦ 连接星空</button>
    <div class="t-err" id="tokenErr"></div>
  </div>
</div>

<div class="img-full" id="imgFull">
  <button class="close-full" id="closeFull">✕</button>
  <img id="imgFullImg" src="" alt="">
</div>

<div class="toast" id="toast"></div>

<script>
(function(){
var GITHUB_USER='xiaohuaiqiu',GITHUB_REPO='starry-sky',STARS_FILE='stars.json',POLL=15000;
var MAX_IMG_SIZE=5*1024*1024; // 5MB
var MAX_IMG_DIM=1200; // max pixel dimension after resize

var token=null,messageStars=[],fileSha=null,addMode=false,imageCache={};
var bgStars=[],shootingStars=[],particles=[],nebula=[],bursts=[];
var pendingX=0,pendingY=0,showInput=false,selectedImage=null,uploading=false;
var time=0,canvas,ctx,W,H,dpr=Math.min(devicePixelRatio||1,2),isMobile=false;
var pollTimer=null,loadingStars=false,syncing=false,lastPopupShow=0;
var clouds=[];

// ─── Time / day-night ───────────────────────────
function getDayMode(){var h=new Date().getHours();return h>=6&&h<18}
function getTimeInPeriod(){var h=new Date().getHours()+new Date().getMinutes()/60;if(h>=6&&h<18)return(h-6)/12;return h<6?(h+6)/12:(h-18)/12}
var dayMode=getDayMode(),dayModeOverride=null;
function isDayMode(){return dayModeOverride!==null?dayModeOverride:getDayMode()}

// ─── DOM ────────────────────────────────────────
var $=function(id){return document.getElementById(id)};
var domBadge,domHint,domFab,domFabLabel,domIndicator,domInputBar,domMsgInput;
var domPhotoBtn,domCancelBtn,domSendBtn,domImgPreview,domImgPreviewImg,domRmImg,domImgLoading;
var domFileInput,domStarPopup,domPopupMsg,domPopupImg,domPopupTime,domClosePopup;
var domListPanel,domStarCards,domPanelSubtitle,domOverlay,domClosePanel;
var domNotification,domDaynightBtn,domSettingsBtn,domListBtn;
var domTokenSetup,domTokenInput,domTokenErr,domBtnConnect,domToast;
var domImgFull,domImgFullImg,domCloseFull;

// ─── Helpers ─────────────────────────────────────
var rand=function(a,b){return a+Math.random()*(b-a)};
var randInt=function(a,b){return Math.floor(rand(a,b+1))};
var dist=function(x1,y1,x2,y2){return Math.hypot(x2-x1,y2-y1)};
var pad=function(n){return('0'+n).slice(-2)};
function esc(s){var d=document.createElement('div');d.textContent=s;return d.innerHTML}
function genId(){return Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,8)}
function tsStr(ms){var d=new Date(ms);return d.getFullYear()+'/'+pad(d.getMonth()+1)+'/'+pad(d.getDate())+' '+pad(d.getHours())+':'+pad(d.getMinutes())}
function toast(m){var t=domToast;t.textContent=m;t.classList.add('show');clearTimeout(t._tid);t._tid=setTimeout(function(){t.classList.remove('show')},1800)}

// ─── GitHub API ──────────────────────────────────
function gh(m,p,b){
  return fetch('https://api.github.com'+p,{method:m,headers:{
    'Authorization':'token '+token,
    'Accept':'application/vnd.github.v3+json',
    'Content-Type':b?'application/json':undefined
  },body:b?JSON.stringify(b):undefined}).then(function(r){
    if(r.status===401){localStorage.removeItem('starry_gh_token');token=null;showTokenSetup('Token 已失效');throw new Error('unauth')}
    return r.json().then(function(d){if(!r.ok)throw new Error(d.message||'err '+r.status);return d})
  })
}

// ─── Image utilities ─────────────────────────────
function getExt(mime){var m={jpeg:'jpg',png:'png',gif:'gif',webp:'webp',bmp:'bmp'};return m[mime.split('/')[1]]||'jpg'}

function resizeImage(file){
  return new Promise(function(resolve){
    if(!file.type.match(/^image\//)){resolve(file);return}
    var url=URL.createObjectURL(file);
    var img=new Image();
    img.onload=function(){
      URL.revokeObjectURL(url);
      var w=img.width,h=img.height;
      if(w<=MAX_IMG_DIM&&h<=MAX_IMG_DIM){resolve(file);return}
      var ratio=Math.min(MAX_IMG_DIM/w,MAX_IMG_DIM/h);
      w=Math.round(w*ratio);h=Math.round(h*ratio);
      var c=document.createElement('canvas');c.width=w;c.height=h;
      var cx=c.getContext('2d');cx.drawImage(img,0,0,w,h);
      c.toBlob(function(blob){resolve(new File([blob],file.name,{type:'image/jpeg'}))},'image/jpeg',.82)
    };
    img.src=url
  })
}

function blobToBase64(blob){
  return new Promise(function(resolve){
    var r=new FileReader();r.onload=function(){resolve(r.result.split(',')[1])};r.readAsDataURL(blob)
  })
}

function fileToDataUrl(file){
  return new Promise(function(resolve){
    var r=new FileReader();r.onload=function(){resolve(r.result)};r.readAsDataURL(file)
  })
}

async function uploadImage(file){
  var resized=await resizeImage(file);
  var b64=await blobToBase64(resized);
  var ext=getExt(resized.type);
  var filename='star_'+Date.now()+'.'+ext;
  var path='images/'+filename;
  await gh('PUT','/repos/'+GITHUB_USER+'/'+GITHUB_REPO+'/contents/'+path,{message:'📷 star image',content:b64,branch:'master'});
  return path
}

function imageUrl(path){return 'https://raw.githubusercontent.com/'+GITHUB_USER+'/'+GITHUB_REPO+'/master/'+path}

function preloadImages(){
  messageStars.forEach(function(ms){
    if(ms.image&&!imageCache[ms.image]){
      var img=new Image();img.crossOrigin='anonymous';img.src=imageUrl(ms.image);
      img.onload=function(){imageCache[ms.image]=img}
    }
  })
}

// Canvas helpers
function rrect(ctx,x,y,w,h,r){
  ctx.beginPath();ctx.moveTo(x+r,y);ctx.lineTo(x+w-r,y);
  ctx.quadraticCurveTo(x+w,y,x+w,y+r);ctx.lineTo(x+w,y+h-r);
  ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);ctx.lineTo(x+r,y+h);
  ctx.quadraticCurveTo(x,y+h,x,y+h-r);ctx.lineTo(x,y+r);
  ctx.quadraticCurveTo(x,y,x+r,y);ctx.closePath()
}

function wrapText(ctx,text,maxW){
  var chars=text.split(''),lines=[],line='';
  chars.forEach(function(c){
    var test=line+c;if(ctx.measureText(test).width>maxW&&line.length>0){lines.push(line);line=c}else{line=test}
  });
  if(line)lines.push(line);return lines
}

// Draw 4-pointed sparkle star
function drawStarShape(ctx,x,y,outerR,innerR,points,rot){
  points=points||4;rot=rot||0;innerR=innerR||outerR*.38;
  ctx.beginPath();
  for(var i=0;i<points*2;i++){
    var r=i%2===0?outerR:innerR;
    var a=rot+Math.PI*2*i/(points*2)-Math.PI/2;
    var sx=x+Math.cos(a)*r,sy=y+Math.sin(a)*r;
    i===0?ctx.moveTo(sx,sy):ctx.lineTo(sx,sy);
  }
  ctx.closePath()
}

// ─── Data ────────────────────────────────────────
function loadStars(){
  if(!token||loadingStars)return Promise.resolve();
  loadingStars=true;
  return gh('GET','/repos/'+GITHUB_USER+'/'+GITHUB_REPO+'/contents/'+STARS_FILE).then(function(d){
    fileSha=d.sha;
    var content=decodeURIComponent(escape(atob(d.content)));
    var parsed=JSON.parse(content);
    if(Array.isArray(parsed)){
      var ids={};messageStars.forEach(function(s,i){ids[s.clientId]=i});
      var changed=false;
      parsed.forEach(function(r){
        if(!(r.clientId in ids)){messageStars.push({x:r.x,y:r.y,message:r.message,image:r.image||null,createdAt:r.createdAt,clientId:r.clientId,fromRemote:true});changed=true}
      });
      if(changed){messageStars.sort(function(a,b){return a.createdAt-b.createdAt});updatePanel();preloadImages()}
    }
    loadingStars=false
  }).catch(function(e){loadingStars=false;if(e.message==='unauth')return})
}

function saveStars(){
  if(!token||syncing)return Promise.resolve();
  syncing=true;
  var arr=messageStars.map(function(s){return{x:s.x,y:s.y,message:s.message,image:s.image||null,createdAt:s.createdAt,clientId:s.clientId}});
  var content=btoa(unescape(encodeURIComponent(JSON.stringify(arr,null,2))));
  var body={message:'✨ a star',content:content};if(fileSha)body.sha=fileSha;
  return gh('PUT','/repos/'+GITHUB_USER+'/'+GITHUB_REPO+'/contents/'+STARS_FILE,body).then(function(d){fileSha=d.content.sha;syncing=false}).catch(function(e){syncing=false;if(e.message==='unauth')return;if(e.message&&e.message.indexOf('409')!==-1)return loadStars().then(function(){return saveStars()})})
}

function stopPoll(){if(pollTimer){clearInterval(pollTimer);pollTimer=null}}

// ─── Panel ───────────────────────────────────────
function updatePanel(){
  if(!domStarCards)return;
  domPanelSubtitle.textContent='共 '+messageStars.length+' 颗星';
  if(!messageStars.length){domStarCards.innerHTML='<div class="empty">还没有星光<br>按右下角 + 留下第一颗吧</div>';return}
  var sorted=messageStars.slice().reverse();
  domStarCards.innerHTML=sorted.map(function(s,idx){
    var realIdx=messageStars.indexOf(s);
    var imgHtml=s.image?'<img class="card-img show" src="'+imageUrl(s.image)+'" loading="lazy" alt="">':'<img class="card-img" src="" alt="">';
    return '<div class="star-card"><div class="card-msg">✦ '+esc(s.message||'(图片)')+'</div>'+imgHtml+'<div class="card-time">'+tsStr(s.createdAt)+'</div><button class="card-del" data-idx="'+realIdx+'">删除这颗星</button></div>'
  }).join('');
  // Bind delete buttons
  [].forEach.call(domStarCards.querySelectorAll('.card-del'),function(btn){
    btn.addEventListener('click',function(e){e.stopPropagation();deleteStar(parseInt(btn.dataset.idx))})
  })
}

function deleteStar(idx){
  if(!token){toast('请先连接星空');return}
  if(!confirm('确定删除这颗星吗？'))return;
  var star=messageStars[idx];
  messageStars.splice(idx,1);
  spawnBurst(star.x,star.y);
  updatePanel();
  saveStars().then(function(){toast('已删除')}).catch(function(){toast('同步失败')})
}

  domTokenSetup.classList.add('show');domTokenErr.textContent=err||'';domTokenInput.value='';
  domBtnConnect.disabled=false;domBtnConnect.textContent='✦ 连接星空';domBadge.textContent='◇ 未连接';stopPoll()

function hideTokenSetup(){domTokenSetup.classList.remove('show')}
function handleConnect(){
  var v=domTokenInput.value.trim();
  if(!v){domTokenErr.textContent='请输入 Token';return}
  if(!v.startsWith('ghp_')&&!v.startsWith('github_pat_')){domTokenErr.textContent='格式不正确';return}
  domBtnConnect.disabled=true;domBtnConnect.textContent='连接中...';domTokenErr.textContent='';token=v;
  fetch('https://api.github.com/user',{headers:{'Authorization':'token '+token}}).then(function(r){if(!r.ok)throw new Error('bad');return r.json()}).then(function(){
    localStorage.setItem('starry_gh_token',token);hideTokenSetup();domBadge.textContent='✦ 已连接';toast('已连接星空 ✨');
    return loadStars().then(function(){preloadImages()})
  }).then(function(){startPoll()}).catch(function(){domTokenErr.textContent='Token 无效';domBtnConnect.disabled=false;domBtnConnect.textContent='✦ 连接星空';token=null})
}

// ─── Add star ────────────────────────────────────
async function addStar(x,y,msg,imgFile){
  var star={x:x,y:y,message:msg,image:null,createdAt:Date.now(),clientId:genId(),fromRemote:false};
  if(imgFile){
    try{
      var path=await uploadImage(imgFile);
      star.image=path;
    }catch(e){toast('图片上传失败:'+e.message);console.warn('Image upload failed:',e)}
  }
  messageStars.push(star);
  if(star.image)preloadImages();
  spawnBurst(x,y);updatePanel();
  saveStars().catch(function(){})
}

// ─── Burst ───────────────────────────────────────
function spawnBurst(cx,cy){for(var i=0;i<26;i++){var a=rand(0,Math.PI*2),s=rand(.003,.016);bursts.push({x:cx,y:cy,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:1,decay:rand(.01,.032),r:rand(1,3.5)})}}
function updateBursts(){for(var i=bursts.length-1;i>=0;i--){var b=bursts[i];b.x+=b.vx;b.y+=b.vy;b.life-=b.decay;if(b.life<=0)bursts.splice(i,1)}}
function drawBursts(ctx){bursts.forEach(function(b){ctx.beginPath();ctx.arc(b.x*W,b.y*H,b.r,0,Math.PI*2);ctx.fillStyle='rgba(255,180,210,'+(b.life*.85)+')';ctx.fill()})}

  var best=null,bd=thresh||.06;
  messageStars.forEach(function(s){var d=dist(cx,cy,s.x,s.y);if(d<bd){bd=d;best=s}});
  return best
}

var scorpio=[
  // Claws (top, extending outward)
  {x:.18,y:.13,r:2.6,type:'claw'},{x:.23,y:.18,r:2.2,type:'claw'},
  {x:.48,y:.12,r:2.4,type:'claw'},{x:.43,y:.17,r:2.1,type:'claw'},
  // Head
  {x:.27,y:.23,r:2.8,type:'head'},{x:.33,y:.21,r:3.2,type:'head'},
  {x:.39,y:.24,r:2.6,type:'head'},
  // Body — Antares is the heart
  {x:.34,y:.32,r:4.5,type:'antares'},
  {x:.35,y:.40,r:2.5,type:'body'},
  {x:.34,y:.48,r:2.3,type:'body'},
  // Tail curling left and up
  {x:.32,y:.55,r:2.4,type:'tail'},
  {x:.28,y:.60,r:2.2,type:'tail'},
  {x:.23,y:.62,r:2.0,type:'tail'},
  {x:.18,y:.58,r:2.6,type:'stinger'},
  {x:.15,y:.54,r:2.0,type:'stinger'}
];
var scorpioLines=[
  // Claws → head
  [0,1],[2,3],[1,4],[3,6],
  // Head line
  [4,5],[5,6],
  // Head → Antares → body
  [5,7],[7,8],[8,9],[9,10],
  // Tail curl
  [10,11],[11,12],[12,13],[13,14]
];
// Extra decorative lines (claw detail)
var scorpioDeco=[[0,2],[14,10]];

// ─── Nebula ──────────────────────────────────────
function genNebula(){
  nebula=[];var n=isMobile?6:10;
  for(var i=0;i<n;i++)nebula.push({x:rand(.05,.95),y:rand(.05,.9),r:rand(.06,.28),hue:rand(280,340),alpha:rand(.01,.05)});
  // Milky way
  for(var j=0;j<4;j++)nebula.push({x:.25+j*.16,y:.25+j*.14,r:rand(.08,.32),hue:rand(290,330),alpha:rand(.015,.045)})
}
function drawNebula(ctx){
  nebula.forEach(function(n){var cx=n.x*W,cy=n.y*H,r=n.r*W;var g=ctx.createRadialGradient(cx,cy,0,cx,cy,r);var c='hsla('+n.hue+',45%,42%,'+n.alpha+')';g.addColorStop(0,c);g.addColorStop(.65,c);g.addColorStop(1,'transparent');ctx.fillStyle=g;ctx.fillRect(cx-r,cy-r,r*2,r*2)})
}

// ─── Background stars ────────────────────────────
function starColor(){var r=Math.random();if(r<.3)return'#ffccdd';if(r<.5)return'#ffb3d9';if(r<.65)return'#e8a0d4';if(r<.78)return'#ff99cc';if(r<.88)return'#d4a0e8';return'#ffc0cb'}
function genBgStars(){
  bgStars=[];var n=isMobile?200:340;
  for(var i=0;i<n;i++){var x=Math.random(),y=Math.random();if(Math.random()<.2){x=.22+x*.42;y=.18+y*.5}bgStars.push({x:x,y:y,r:rand(.2,2.5),phase:rand(0,Math.PI*2),speed:rand(.25,4.5),baseAlpha:rand(.18,.95),color:starColor()})}
  var h=isMobile?10:20;for(var j=0;j<h;j++){var idx=randInt(0,bgStars.length-1);bgStars[idx].r=rand(2,4.5);bgStars[idx].baseAlpha=rand(.65,1);bgStars[idx].speed=rand(1.5,5.5);bgStars[idx].shape=true}
}
function drawBgStars(ctx,t,mul){mul=mul||1;bgStars.forEach(function(s){var a=s.baseAlpha*(.38+.62*Math.sin(s.phase+t*s.speed*.001))*mul;if(s.shape&&s.r>1.8){drawStarShape(ctx,s.x*W,s.y*H,s.r*3.2,s.r*1.1,4,t*.0005+s.x*10);ctx.fillStyle=s.color;ctx.globalAlpha=a;ctx.fill()}else{ctx.beginPath();ctx.arc(s.x*W,s.y*H,s.r,0,Math.PI*2);ctx.fillStyle=s.color;ctx.globalAlpha=a;ctx.fill()}});ctx.globalAlpha=1}

// ─── Shooting stars ──────────────────────────────
function spawnShooting(){var fl=Math.random()<.5;shootingStars.push({x:fl?rand(0,.22):rand(.78,1),y:rand(.02,.32),vx:fl?rand(.0045,.012):rand(-.012,-.0045),vy:rand(.001,.006),life:1,decay:rand(.005,.016),len:rand(.04,.16)})}
function drawShooting(ctx){shootingStars.forEach(function(s){var sx=s.x*W,sy=s.y*H,ex=sx-s.vx*W*38,ey=sy-s.vy*H*38;var g=ctx.createLinearGradient(sx,sy,ex,ey);g.addColorStop(0,'rgba(255,180,220,'+s.life+')');g.addColorStop(.2,'rgba(255,160,210,'+(s.life*.7)+')');g.addColorStop(1,'rgba(255,180,220,0)');ctx.strokeStyle=g;ctx.lineWidth=2.4;ctx.beginPath();ctx.moveTo(sx,sy);ctx.lineTo(ex,ey);ctx.stroke();ctx.beginPath();ctx.arc(sx,sy,4,0,Math.PI*2);ctx.fillStyle='rgba(255,190,225,'+s.life+')';ctx.fill()})}
function updateShooting(){for(var i=shootingStars.length-1;i>=0;i--){var s=shootingStars[i];s.x+=s.vx;s.y+=s.vy;s.life-=s.decay;if(s.life<=0||s.x<-.1||s.x>1.1||s.y>1.1)shootingStars.splice(i,1)}}

// ─── Particles ───────────────────────────────────
function genParticles(){particles=[];var n=isMobile?28:60;for(var i=0;i<n;i++)particles.push({x:Math.random(),y:Math.random(),r:rand(.12,.65),vx:rand(-7e-5,7e-5),vy:rand(-3e-5,3e-5),alpha:rand(.1,.38),phase:rand(0,Math.PI*2),speed:rand(.18,1.8)})}
function drawParticles(ctx,t){particles.forEach(function(p){p.x+=p.vx+Math.sin(t*.0005+p.phase)*.00007;p.y+=p.vy+Math.cos(t*.0005+p.phase)*.00004;if(p.x<0)p.x=1;if(p.x>1)p.x=0;if(p.y<0)p.y=1;if(p.y>1)p.y=0;var a=p.alpha*(.35+.65*Math.sin(t*.001*p.speed+p.phase));ctx.beginPath();ctx.arc(p.x*W,p.y*H,p.r,0,Math.PI*2);ctx.fillStyle='rgba(230,180,220,'+a+')';ctx.fill()})}

// ─── Constellation ───────────────────────────────
function drawConstellation(ctx,t){
  // Collect all star positions for bounding area
  var cx=0,cy=0;scorpio.forEach(function(s){cx+=s.x;cy+=s.y});cx/=scorpio.length;cy/=scorpio.length;
  // Large ambient glow behind the whole constellation
  var ambG=ctx.createRadialGradient(cx*W,cy*H,0,cx*W,cy*H,isMobile?W*.26:W*.22);
  ambG.addColorStop(0,'rgba(200,140,180,.07)');
  ambG.addColorStop(.5,'rgba(180,120,160,.03)');
  ambG.addColorStop(1,'transparent');
  ctx.fillStyle=ambG;ctx.fillRect(0,0,W,H);

  // Draw decorative faint lines first
  ctx.strokeStyle='rgba(200,150,190,.06)';ctx.lineWidth=.3;ctx.setLineDash([1,8]);
  scorpioDeco.forEach(function(p){var a=scorpio[p[0]],b=scorpio[p[1]];ctx.beginPath();ctx.moveTo(a.x*W,a.y*H);ctx.lineTo(b.x*W,b.y*H);ctx.stroke()});
  ctx.setLineDash([]);

  // Draw main connecting lines
  var lineAlpha=.22+Math.sin(t*.0008)*.04;
  ctx.strokeStyle='rgba(230,170,210,'+lineAlpha+')';ctx.lineWidth=isMobile?.8:1.1;ctx.setLineDash([4,5]);
  scorpioLines.forEach(function(p){var a=scorpio[p[0]],b=scorpio[p[1]];ctx.beginPath();ctx.moveTo(a.x*W,a.y*H);ctx.lineTo(b.x*W,b.y*H);ctx.stroke()});
  ctx.setLineDash([]);

  // Draw stars
  scorpio.forEach(function(s,i){
    var pulse=1+.08*Math.sin(t*.0018+s.x*18+s.y*18);
    var sx=s.x*W,sy=s.y*H;
    var isBright=s.type==='antares'||s.type==='stinger';
    var isAntares=s.type==='antares';

    // Outer glow
    var glowR=s.r*(isAntares?14:isBright?10:7)*pulse;
    var g=ctx.createRadialGradient(sx,sy,0,sx,sy,glowR);
    if(isAntares){
      g.addColorStop(0,'rgba(255,140,180,.55)');
      g.addColorStop(.25,'rgba(240,120,160,.3)');
      g.addColorStop(.6,'rgba(200,100,150,.08)');
      g.addColorStop(1,'transparent');
    }else if(isBright){
      g.addColorStop(0,'rgba(255,170,200,.45)');
      g.addColorStop(.4,'rgba(220,150,190,.15)');
      g.addColorStop(1,'transparent');
    }else{
      g.addColorStop(0,'rgba(220,170,210,.35)');
      g.addColorStop(.5,'rgba(200,150,190,.1)');
      g.addColorStop(1,'transparent');
    }
    ctx.fillStyle=g;ctx.beginPath();ctx.arc(sx,sy,glowR,0,Math.PI*2);ctx.fill();

    // Star core — sparkle shape for bright stars, circle for normal
    if(isAntares){
      // Large sparkle
      drawStarShape(ctx,sx,sy,s.r*2.8*pulse,s.r*1.0*pulse,4,t*.0012);
      ctx.fillStyle='rgba(255,180,200,.85)';ctx.fill();
      // Inner bright core
      drawStarShape(ctx,sx,sy,s.r*1.4*pulse,s.r*.5*pulse,4,-t*.0008);
      ctx.fillStyle='rgba(255,200,220,.95)';ctx.fill();
    }else if(isBright){
      drawStarShape(ctx,sx,sy,s.r*2.2*pulse,s.r*.8*pulse,4,t*.001);
      ctx.fillStyle='rgba(255,180,210,.8)';ctx.fill();
      drawStarShape(ctx,sx,sy,s.r*1.1*pulse,s.r*.4*pulse,4,-t*.0008);
      ctx.fillStyle='rgba(255,200,225,.9)';ctx.fill();
    }else{
      // Normal star — small sparkle
      drawStarShape(ctx,sx,sy,s.r*1.8*pulse,s.r*.6*pulse,4,t*.0008+s.x*8);
      ctx.fillStyle='rgba(235,180,210,.7)';ctx.fill();
    }

    // Tiny bright core dot for all stars
    ctx.beginPath();ctx.arc(sx,sy,s.r*.35*pulse,0,Math.PI*2);
    ctx.fillStyle='rgba(255,220,240,.9)';ctx.fill();
  })
}

// ─── Message stars ───────────────────────────────
function drawMessageStars(ctx,t){
  messageStars.forEach(function(ms){
    var sx=ms.x*W,sy=ms.y*H;
    var age=Date.now()-ms.createdAt,isNew=age<2800;
    var scale=isNew?.18+.82*Math.min(1,age/2800):1;
    var pulse=1+.08*Math.sin(t*.003+ms.x*12+ms.y*12);
    var hasImg=!!ms.image;
    var img=hasImg?imageCache[ms.image]:null;

    if(hasImg){
      // ── Image card (Polaroid style) ──
      var cw=isMobile?72:90,pad=5,iw=cw-pad*2,ih=iw;
      var text=ms.message||'';
      var fontSize=isMobile?10:11;
      ctx.font=fontSize+'px -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif';
      var lines=text?wrapText(ctx,text,cw-pad*2):[];
      var th=lines.length>0?lines.length*(fontSize+3)+pad:0;
      var ch=pad+ih+(th>0?pad+th:0)+pad;
      var cx=sx-cw/2,cy=sy-ch*.6;
      // Keep card in viewport
      cx=Math.max(8,Math.min(W-cw-8,cx));
      cy=Math.max(8,Math.min(H-ch-8,cy));
      var midX=cx+cw/2,midY=cy+ch/2;

      // Glow behind card
      var glowR=Math.max(cw,ch)*.8*scale*pulse;
      var glow=ctx.createRadialGradient(midX,midY,0,midX,midY,glowR);
      glow.addColorStop(0,'rgba(230,170,210,'+(.45*scale)+')');
      glow.addColorStop(.4,'rgba(210,150,190,'+(.18*scale)+')');
      glow.addColorStop(1,'transparent');
      ctx.fillStyle=glow;ctx.beginPath();ctx.arc(midX,midY,glowR,0,Math.PI*2);ctx.fill();

      // Card shadow
      ctx.shadowColor='rgba(0,0,0,'+(.35*scale)+')';ctx.shadowBlur=14*scale;

      // Card bg
      rrect(ctx,cx,cy,cw,ch,10);
      var cardBg=ctx.createLinearGradient(cx,cy,cx,cy+ch);
      cardBg.addColorStop(0,'rgba(28,26,52,.94)');cardBg.addColorStop(1,'rgba(22,20,44,.96)');
      ctx.fillStyle=cardBg;ctx.fill();
      ctx.shadowColor='transparent';ctx.shadowBlur=0;

      // Card border
      ctx.strokeStyle='rgba(230,180,210,'+(.18*scale)+')';ctx.lineWidth=1;ctx.stroke();

      // Image
      if(img&&img.complete&&img.naturalWidth>0){
        ctx.save();rrect(ctx,cx+pad,cy+pad,iw,ih,5);ctx.clip();
        ctx.drawImage(img,cx+pad,cy+pad,iw,ih);ctx.restore();
        // Subtle inner border
        rrect(ctx,cx+pad,cy+pad,iw,ih,5);
        ctx.strokeStyle='rgba(255,255,255,.08)';ctx.lineWidth=.5;ctx.stroke();
      }else{
        // Placeholder while loading
        ctx.fillStyle='rgba(255,255,255,.04)';rrect(ctx,cx+pad,cy+pad,iw,ih,5);ctx.fill();
        ctx.fillStyle='rgba(255,255,255,.15)';ctx.font='20px sans-serif';
        ctx.textAlign='center';ctx.fillText('⟳',midX,cy+pad+ih/2+7);
      }

      // Text below image
      if(lines.length>0){
        var ty=cy+pad+ih+pad;
        ctx.fillStyle='rgba(230,225,245,.9)';
        ctx.textAlign='center';
        lines.forEach(function(ln,i){
          ctx.fillText(ln,midX,ty+(i+1)*fontSize+i*3);
        });
      }

      // Small sparkle on top-left of card
      var spX=cx+2,spY=cy;
      ctx.fillStyle='rgba(255,190,220,'+(.7*scale*pulse)+')';
      ctx.beginPath();ctx.arc(spX,spY,2.5*scale,0,Math.PI*2);ctx.fill();
      ctx.fillStyle='#fff';
      ctx.beginPath();ctx.arc(spX,spY,1.2*scale,0,Math.PI*2);ctx.fill();

    }else{
      // ── Text-only card (pink note) ──
      var text=ms.message||'✦';
      var fontSize=isMobile?11:13;
      ctx.font='600 '+fontSize+'px -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif';
      var pad=7;
      var maxTW=isMobile?100:130;
      var cw=Math.min(maxTW,Math.max(44,ctx.measureText(text).width+pad*2+10));
      var lines=wrapText(ctx,text,cw-pad*2);
      var lh=fontSize+4;
      var textH=lines.length*lh;
      var ch=pad+textH+pad;
      var cx=sx-cw/2,cy=sy-ch*.55;
      cx=Math.max(8,Math.min(W-cw-8,cx));
      cy=Math.max(8,Math.min(H-ch-8,cy));
      var midX=cx+cw/2,midY=cy+ch/2;

      // Warm glow
      var glowR=Math.max(cw,ch)*.75*scale*pulse;
      var glow=ctx.createRadialGradient(midX,midY,0,midX,midY,glowR);
      glow.addColorStop(0,'rgba(240,150,200,'+(.5*scale)+')');
      glow.addColorStop(.35,'rgba(220,130,180,'+(.2*scale)+')');
      glow.addColorStop(1,'transparent');
      ctx.fillStyle=glow;ctx.beginPath();ctx.arc(midX,midY,glowR,0,Math.PI*2);ctx.fill();

      // Card shadow
      ctx.shadowColor='rgba(0,0,0,'+(.3*scale)+')';ctx.shadowBlur=12*scale;

      // Card bg
      rrect(ctx,cx,cy,cw,ch,8);
      var cardBg=ctx.createLinearGradient(cx,cy,cx,cy+ch);
      cardBg.addColorStop(0,'rgba(48,24,44,.93)');cardBg.addColorStop(1,'rgba(36,18,32,.95)');
      ctx.fillStyle=cardBg;ctx.fill();
      ctx.shadowColor='transparent';ctx.shadowBlur=0;

      // Card border
      ctx.strokeStyle='rgba(240,160,200,'+(.22*scale)+')';ctx.lineWidth=1;ctx.stroke();

      // Text
      ctx.fillStyle='rgba(255,210,230,.92)';ctx.textAlign='center';
      lines.forEach(function(ln,i){
        ctx.fillText(ln,midX,cy+pad+(i+1)*fontSize+i*3);
      });

      // Sparkle dot top-left
      var spX=cx+3,spY=cy+1;
      ctx.fillStyle='rgba(255,180,210,'+(.8*scale*pulse)+')';
      ctx.beginPath();ctx.arc(spX,spY,2*scale,0,Math.PI*2);ctx.fill();
      ctx.fillStyle='#fff';
      ctx.beginPath();ctx.arc(spX,spY,.8*scale,0,Math.PI*2);ctx.fill();
    }

    // Entrance burst ring for new stars
    if(isNew&&scale<.9){
      var ringR=Math.max(30,50)*(1-scale);
      ctx.beginPath();ctx.arc(sx,sy,ringR,0,Math.PI*2);
      ctx.strokeStyle='rgba(255,180,210,'+(.35*(1-scale))+')';
      ctx.lineWidth=1.5;ctx.stroke();
    }
  })
}

// ─── Clouds ──────────────────────────────────────
function genClouds(){
  clouds=[];var n=isMobile?5:9;
  for(var i=0;i<n;i++){
    clouds.push({x:Math.random(),y:rand(.03,.38),w:rand(.08,.24),h:rand(.03,.09),speed:rand(.00008,.0003),opacity:rand(.55,.92)})
  }
}
function drawClouds(ctx,t){
  clouds.forEach(function(c){
    c.x+=c.speed;if(c.x>1.25)c.x=-.25;
    var cx=c.x*W,cy=c.y*H,cw=c.w*W,ch=c.h*H;
    ctx.fillStyle='rgba(255,255,255,'+c.opacity+')';
    ctx.beginPath();
    ctx.arc(cx,cy,ch*.55,0,Math.PI*2);
    ctx.arc(cx+cw*.2,cy-ch*.12,ch*.42,0,Math.PI*2);
    ctx.arc(cx+cw*.48,cy-ch*.06,ch*.5,0,Math.PI*2);
    ctx.arc(cx+cw*.72,cy-ch*.02,ch*.38,0,Math.PI*2);
    ctx.arc(cx+cw*.35,cy+ch*.1,ch*.48,0,Math.PI*2);
    ctx.fill()
  })
}
function drawSun(ctx){
  var p=getTimeInPeriod();
  var sunX=W*(.08+p*.84);
  var arcY=Math.sin(p*Math.PI);
  var sunY=H*(.48-arcY*.32);
  // Outer glow
  var g=ctx.createRadialGradient(sunX,sunY,0,sunX,sunY,isMobile?90:130);
  g.addColorStop(0,'rgba(255,255,220,1)');
  g.addColorStop(.15,'rgba(255,245,180,.85)');
  g.addColorStop(.4,'rgba(255,210,120,.35)');
  g.addColorStop(.7,'rgba(255,180,100,.08)');
  g.addColorStop(1,'transparent');
  ctx.fillStyle=g;ctx.beginPath();ctx.arc(sunX,sunY,isMobile?90:130,0,Math.PI*2);ctx.fill();
  // Core
  ctx.fillStyle='#fffef5';ctx.beginPath();ctx.arc(sunX,sunY,isMobile?28:38,0,Math.PI*2);ctx.fill();
  // Inner glow
  var g2=ctx.createRadialGradient(sunX,sunY,0,sunX,sunY,isMobile?50:65);
  g2.addColorStop(0,'rgba(255,255,240,1)');g2.addColorStop(.5,'rgba(255,240,200,.5)');g2.addColorStop(1,'transparent');
  ctx.fillStyle=g2;ctx.beginPath();ctx.arc(sunX,sunY,isMobile?50:65,0,Math.PI*2);ctx.fill()
}

// ─── Render ──────────────────────────────────────
function render(ts){
  time=ts;ctx.clearRect(0,0,W,H);
  dayMode=isDayMode();
  if(dayMode){
    // Day sky: blue gradient
    var sky=ctx.createLinearGradient(0,0,0,H);
    sky.addColorStop(0,'#3a7bd5');
    sky.addColorStop(.35,'#6db3f2');
    sky.addColorStop(.65,'#a8d8f8');
    sky.addColorStop(1,'#d4e8fc');
    ctx.fillStyle=sky;ctx.fillRect(0,0,W,H);
    drawSun(ctx);
    drawClouds(ctx,ts);
    // Faint stars still visible in day
    drawBgStars(ctx,ts,.12);
  }else{
    // Night sky: dark (keep current)
    var sky=ctx.createRadialGradient(W*.5,H*.22,0,W*.5,H*.5,Math.max(W,H)*1.35);
    sky.addColorStop(0,'#080826');sky.addColorStop(.22,'#06061e');
    sky.addColorStop(.5,'#040415');sky.addColorStop(1,'#01010a');
    ctx.fillStyle=sky;ctx.fillRect(0,0,W,H);
    drawNebula(ctx);drawBgStars(ctx,ts);drawConstellation(ctx,ts);
    drawParticles(ctx,ts);updateShooting();drawShooting(ctx);
  }
  updateBursts();drawBursts(ctx);drawMessageStars(ctx,ts);
  requestAnimationFrame(render)
}

// ─── Resize ──────────────────────────────────────
function resize(){W=innerWidth;H=innerHeight;canvas.width=W*dpr;canvas.height=H*dpr;canvas.style.width=W+'px';canvas.style.height=H+'px';ctx.setTransform(dpr,0,0,dpr,0,0);genNebula();genBgStars();genParticles();genClouds()}

// ─── Init ────────────────────────────────────────
function init(){
  canvas=$('sky');ctx=canvas.getContext('2d');isMobile=innerWidth<600||('ontouchstart' in window&&innerWidth<1024);
  domBadge=$('badge');domHint=$('hint');domFab=$('fab');domFabLabel=$('fabLabel');domIndicator=$('indicator');
  domInputBar=$('inputBar');domMsgInput=$('msgInput');domPhotoBtn=$('photoBtn');domCancelBtn=$('cancelBtn');domSendBtn=$('sendBtn');
  domImgPreview=$('imgPreview');domImgPreviewImg=$('imgPreviewImg');domRmImg=$('rmImg');domImgLoading=$('imgLoading');
  domFileInput=$('fileInput');domStarPopup=$('starPopup');domPopupMsg=$('popupMsg');domPopupImg=$('popupImg');domPopupTime=$('popupTime');domClosePopup=$('closePopup');
  domListPanel=$('listPanel');domStarCards=$('starCards');domPanelSubtitle=$('panelSubtitle');domOverlay=$('overlay');domClosePanel=$('closePanel');
  domNotification=$('notification');domDaynightBtn=$('daynightBtn');domSettingsBtn=$('settingsBtn');domListBtn=$('listBtn');
  domTokenSetup=$('tokenSetup');domTokenInput=$('tokenInput');domTokenErr=$('tokenErr');domBtnConnect=$('btnConnect');
  domToast=$('toast');domImgFull=$('imgFull');domImgFullImg=$('imgFullImg');domCloseFull=$('closeFull');

  resize();
  addEventListener('resize',function(){W=innerWidth;H=innerHeight;canvas.width=W*dpr;canvas.height=H*dpr;canvas.style.width=W+'px';canvas.style.height=H+'px';ctx.setTransform(dpr,0,0,dpr,0,0);genNebula();genBgStars();genParticles();genClouds()});

  token=localStorage.getItem('starry_gh_token');
  if(token){domBadge.textContent='✦ 已连接';hideTokenSetup();loadStars().then(function(){preloadImages();startPoll()})}else showTokenSetup();
  updatePanel();

  // Events
  canvas.addEventListener('click',handleCanvasClick);
  canvas.addEventListener('touchend',function(e){e.preventDefault();if(e.changedTouches.length===1)handleCanvasClick(e.changedTouches[0])});
  canvas.addEventListener('mousemove',function(e){if(addMode||showInput)return;var r=canvas.getBoundingClientRect();var cx=(e.clientX-r.left)/r.width,cy=(e.clientY-r.top)/r.height;canvas.style.cursor=findNearest(cx,cy,.06)?'pointer':'default'});

  domFab.addEventListener('click',function(e){e.stopPropagation();toggleAddMode()});
  domSendBtn.addEventListener('click',handleSubmit);
  domCancelBtn.addEventListener('click',hideInput);
  domMsgInput.addEventListener('keydown',function(e){if(e.key==='Enter')handleSubmit();if(e.key==='Escape')hideInput()});
  domPhotoBtn.addEventListener('click',handlePhotoClick);
  domFileInput.addEventListener('change',handleFileChange);
  domRmImg.addEventListener('click',handleRmImg);

  domClosePopup.addEventListener('click',hidePopup);
  domStarPopup.addEventListener('click',function(e){e.stopPropagation()});
  document.addEventListener('click',function(e){if(!domStarPopup.classList.contains('show'))return;if(Date.now()-lastPopupShow<300)return;if(!domStarPopup.contains(e.target))hidePopup()});

  domListBtn.addEventListener('click',togglePanel);domClosePanel.addEventListener('click',closePanel);domOverlay.addEventListener('click',closePanel);
  domSettingsBtn.addEventListener('click',showTokenSetup);
  domDaynightBtn.addEventListener('click',function(){
    if(dayModeOverride===null){dayModeOverride=true}else if(dayModeOverride===true){dayModeOverride=false}else{dayModeOverride=null}
    updateDaynightBtn()
  });
  function updateDaynightBtn(){
    if(dayModeOverride===null){domDaynightBtn.textContent='⟳';domDaynightBtn.title='自动（点击切换白天）'}
    else if(dayModeOverride){domDaynightBtn.textContent='☀';domDaynightBtn.title='已锁定白天（点击切换黑夜）'}
    else{domDaynightBtn.textContent='🌙';domDaynightBtn.title='已锁定黑夜（点击切换自动）'}
  }
  updateDaynightBtn();
  domBtnConnect.addEventListener('click',handleConnect);
  domTokenInput.addEventListener('keydown',function(e){if(e.key==='Enter')handleConnect()});

  domCloseFull.addEventListener('click',function(){domImgFull.classList.remove('show')});
  domImgFull.addEventListener('click',function(e){if(e.target===domImgFull)domImgFull.classList.remove('show')});

  (function schedule(){setTimeout(function(){spawnShooting();schedule()},rand(isMobile?20000:10000,isMobile?60000:30000))})();
  requestAnimationFrame(render)
}
init()
})();
</script>
