<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>星空物语</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg: #08081a;
  --surface: rgba(20,18,40,0.92);
  --text: #e0ddf0;
  --sub: #8886a0;
  --gold: #f0c060;
  --gold-bright: #ffd780;
}

body {
  font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
  background: var(--bg); overflow: hidden; height: 100dvh; width: 100vw; position: fixed;
  -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none;
}

canvas { display: block; position: fixed; top: 0; left: 0; width: 100%; height: 100%; }

.hint {
  position: fixed; bottom: 120px; left: 50%; transform: translateX(-50%);
  color: rgba(255,255,255,0.35); font-size: 13px; letter-spacing: 2px;
  pointer-events: none; transition: opacity 0.6s; z-index: 5;
}

.input-bar {
  position: fixed; bottom: 40px; left: 50%; transform: translateX(-50%) translateY(20px);
  display: flex; gap: 10px; align-items: center;
  background: var(--surface); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
  border-radius: 24px; padding: 6px 6px 6px 20px;
  box-shadow: 0 8px 40px rgba(0,0,0,0.5), 0 0 0 1px rgba(255,255,255,0.08);
  opacity: 0; pointer-events: none;
  transition: opacity 0.4s, transform 0.4s cubic-bezier(.16,1,.3,1);
  z-index: 10; max-width: 90vw;
}
.input-bar.active { opacity: 1; pointer-events: auto; transform: translateX(-50%) translateY(0); }
.input-bar input {
  width: 200px; max-width: 50vw; background: transparent; border: none;
  color: var(--text); font-size: 15px; outline: none; font-family: inherit;
}
.input-bar input::placeholder { color: var(--sub); }
.input-bar .send-btn {
  width: 40px; height: 40px; border-radius: 50%; border: none;
  background: var(--gold); color: #1a1a2e; font-size: 18px;
  cursor: pointer; flex-shrink: 0; transition: .2s; display: flex; align-items: center; justify-content: center;
}
.input-bar .send-btn:hover { background: var(--gold-bright); transform: scale(1.05); }
.input-bar .send-btn:active { transform: scale(.92); }
.input-bar .cancel-btn {
  width: 32px; height: 32px; border-radius: 50%; border: none;
  background: transparent; color: var(--sub); font-size: 14px;
  cursor: pointer; flex-shrink: 0; margin-left: -4px;
}

.cursor-dot {
  position: fixed; width: 8px; height: 8px; border-radius: 50%;
  background: var(--gold); pointer-events: none; z-index: 6;
  transform: translate(-50%, -50%) scale(0);
  transition: transform 0.35s cubic-bezier(.16,1,.3,1);
  box-shadow: 0 0 20px var(--gold-bright), 0 0 40px rgba(240,192,96,0.4);
}
.cursor-dot.show { transform: translate(-50%, -50%) scale(1); }

.star-popup {
  position: fixed; z-index: 20;
  background: var(--surface); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
  border-radius: 16px; padding: 16px 20px;
  box-shadow: 0 8px 40px rgba(0,0,0,0.5), 0 0 0 1px rgba(255,255,255,0.08);
  opacity: 0; pointer-events: none; transform: translate(-50%, -50%) scale(.9);
  transition: opacity 0.3s, transform 0.3s cubic-bezier(.16,1,.3,1);
  max-width: 260px; text-align: center;
}
.star-popup.show { opacity: 1; pointer-events: auto; transform: translate(-50%, -50%) scale(1); }
.star-popup .msg { font-size: 15px; color: var(--text); line-height: 1.5; word-break: break-word; }
.star-popup .time { font-size: 11px; color: var(--sub); margin-top: 8px; }
.star-popup .close-popup {
  position: absolute; top: 6px; right: 10px; background: none; border: none;
  color: var(--sub); cursor: pointer; font-size: 14px;
}

.list-panel {
  position: fixed; right: 0; top: 0; bottom: 0; width: 300px; max-width: 85vw;
  background: var(--surface); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
  z-index: 30; transform: translateX(100%); transition: transform 0.4s cubic-bezier(.16,1,.3,1);
  padding: 24px 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px;
  box-shadow: -8px 0 40px rgba(0,0,0,0.3);
}
.list-panel.open { transform: translateX(0); }
.list-panel h3 { font-size: 16px; color: var(--text); margin-bottom: 4px; font-weight: 600; }
.list-panel .subtitle { font-size: 12px; color: var(--sub); margin-bottom: 12px; }
.list-panel .star-card {
  background: rgba(255,255,255,0.04); border-radius: 12px; padding: 12px 14px;
  border: 1px solid rgba(255,255,255,0.06);
}
.list-panel .star-card .card-msg { font-size: 14px; color: var(--text); line-height: 1.5; }
.list-panel .star-card .card-time { font-size: 11px; color: var(--sub); margin-top: 6px; }
.list-panel .empty { text-align: center; color: var(--sub); padding: 40px 20px; font-size: 14px; }
.close-panel {
  position: absolute; top: 16px; right: 16px; width: 32px; height: 32px;
  border-radius: 50%; border: none; background: rgba(255,255,255,0.08);
  color: var(--text); cursor: pointer; font-size: 16px; display: flex; align-items: center; justify-content: center;
}

.corner-btns { position: fixed; top: 20px; right: 20px; display: flex; gap: 8px; z-index: 8; }
.corner-btn {
  width: 40px; height: 40px; border-radius: 50%; border: none;
  background: var(--surface); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  color: var(--text); font-size: 18px; cursor: pointer;
  box-shadow: 0 4px 20px rgba(0,0,0,0.3), 0 0 0 1px rgba(255,255,255,0.06);
  display: flex; align-items: center; justify-content: center; transition: .2s;
}
.corner-btn:hover { background: rgba(255,255,255,0.12); }
.corner-btn:active { transform: scale(.9); }

.notification {
  position: fixed; top: 50%; left: 50%; transform: translate(-50%,-50%);
  color: var(--gold); font-size: 15px; letter-spacing: 2px;
  pointer-events: none; z-index: 25; opacity: 0;
  transition: opacity 0.5s;
  text-shadow: 0 0 30px var(--gold-bright);
}

.overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,0.3); z-index: 25;
  opacity: 0; pointer-events: none; transition: opacity 0.3s;
}
.overlay.show { opacity: 1; pointer-events: auto; }

.mode-badge {
  position: fixed; top: 24px; left: 20px; z-index: 8;
  font-size: 11px; color: rgba(255,255,255,0.3); letter-spacing: 2px;
}

/* Token setup */
.token-setup {
  position: fixed; inset: 0; z-index: 40;
  display: flex; align-items: center; justify-content: center;
  background: rgba(4,4,12,0.85); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
  opacity: 0; pointer-events: none; transition: opacity 0.4s;
}
.token-setup.show { opacity: 1; pointer-events: auto; }
.token-card {
  background: var(--surface); border-radius: 20px; padding: 32px 24px;
  max-width: 360px; width: 90%; text-align: center;
  box-shadow: 0 16px 60px rgba(0,0,0,0.6), 0 0 0 1px rgba(255,255,255,0.06);
}
.token-card .icon { font-size: 48px; margin-bottom: 12px; }
.token-card h2 { font-size: 20px; color: var(--text); margin-bottom: 8px; font-weight: 700; }
.token-card p { font-size: 13px; color: var(--sub); margin-bottom: 6px; line-height: 1.6; }
.token-card input {
  width: 100%; padding: 12px 14px; border: 1.5px solid rgba(255,255,255,0.1);
  border-radius: 12px; font-size: 13px; background: rgba(255,255,255,0.04);
  color: var(--text); outline: none; font-family: 'SF Mono', 'Cascadia Code', 'Consolas', monospace;
  margin: 16px 0 12px; transition: .2s; letter-spacing: 0.5px;
}
.token-card input:focus { border-color: var(--gold); }
.token-card .btn-connect {
  width: 100%; padding: 12px; border: none; border-radius: 12px;
  background: var(--gold); color: #1a1a2e; font-size: 15px; font-weight: 600;
  cursor: pointer; transition: .2s; letter-spacing: 2px;
}
.token-card .btn-connect:hover { background: var(--gold-bright); }
.token-card .btn-connect:active { transform: scale(.97); }
.token-card .btn-connect:disabled { opacity: 0.5; cursor: not-allowed; }
.token-card .err { font-size: 12px; color: #e06060; margin-top: 8px; min-height: 18px; }

.toast {
  position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
  background: rgba(30,30,50,0.95); color: #fff; padding: 10px 24px; border-radius: 20px;
  font-size: 14px; z-index: 99; opacity: 0; pointer-events: none;
  transition: opacity 0.3s; backdrop-filter: blur(10px);
}
.toast.show { opacity: 1; }

@media (max-width: 480px) {
  .corner-btns { top: 16px; right: 16px; gap: 6px; }
  .corner-btn { width: 36px; height: 36px; font-size: 16px; }
  .hint { bottom: 100px; font-size: 12px; }
  .input-bar { bottom: 30px; }
  .token-card { padding: 24px 18px; }
  .token-card h2 { font-size: 18px; }
}
</style>
</head>
<body>

<canvas id="sky"></canvas>

<div class="mode-badge" id="modeBadge"></div>
<div class="hint" id="hint">轻触星空，留下一颗星</div>
<div class="cursor-dot" id="cursorDot"></div>

<div class="input-bar" id="inputBar">
  <input type="text" id="msgInput" placeholder="写一句话..." maxlength="60">
  <button class="cancel-btn" id="cancelBtn">✕</button>
  <button class="send-btn" id="sendBtn">✦</button>
</div>

<div class="star-popup" id="starPopup">
  <button class="close-popup" id="closePopup">✕</button>
  <div class="msg" id="popupMsg"></div>
  <div class="time" id="popupTime"></div>
</div>

<div class="corner-btns">
  <button class="corner-btn" id="settingsBtn" title="设置">⚙</button>
  <button class="corner-btn" id="listBtn" title="所有星光">✦</button>
</div>

<div class="overlay" id="overlay"></div>

<div class="list-panel" id="listPanel">
  <button class="close-panel" id="closePanel">✕</button>
  <h3>✦ 所有星光</h3>
  <div class="subtitle" id="panelSubtitle"></div>
  <div id="starCards"></div>
</div>

<div class="notification" id="notification"></div>

<!-- Token setup overlay -->
<div class="token-setup" id="tokenSetup">
  <div class="token-card">
    <div class="icon">🌌</div>
    <h2>连接星空</h2>
    <p>输入 GitHub Token 来连接你们的星空</p>
    <p style="font-size:11px;color:rgba(255,255,255,0.25);">Token 仅存在你的浏览器本地，不会上传到任何地方</p>
    <input type="password" id="tokenInput" placeholder="ghp_xxxxxxxxxxxxxxxxxxxx">
    <button class="btn-connect" id="btnConnect">✦ 连接</button>
    <div class="err" id="tokenErr"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
(function() {
// ─── Config ──────────────────────────────────────
var GITHUB_USER = 'xiaohuaiqiu';
var GITHUB_REPO = 'starry-sky';
var STARS_FILE = 'stars.json';
var POLL_INTERVAL = 12000; // 12 seconds

// ─── State ───────────────────────────────────────
var token = null;
var messageStars = [];
var fileSha = null;
var bgStars = [];
var shootingStars = [];
var floatingParticles = [];
var nebulaPoints = [];
var pendingX = 0, pendingY = 0;
var showInput = false;
var time = 0;
var canvas, ctx;
var W, H;
var dpr = Math.min(window.devicePixelRatio || 1, 2);
var isMobile = false;
var pollTimer = null;
var loadingStars = false;

// ─── DOM refs ────────────────────────────────────
var $ = function(id) { return document.getElementById(id); };
var domHint, domCursor, domInputBar, domMsgInput, domStarPopup, domPopupMsg, domPopupTime;
var domListPanel, domStarCards, domPanelSubtitle, domOverlay, domNotification, domModeBadge;
var domTokenSetup, domTokenInput, domTokenErr, domBtnConnect;

// ─── Helpers ─────────────────────────────────────
var rand = function(a,b) { return a + Math.random() * (b-a); };
var randInt = function(a,b) { return Math.floor(rand(a,b+1)); };
var dist = function(x1,y1,x2,y2) { return Math.hypot(x2-x1, y2-y1); };
function esc(s) { var d = document.createElement('div'); d.textContent = s; return d.innerHTML; }

// ─── Toast ───────────────────────────────────────
function toast(msg) {
  var el = $('toast');
  el.textContent = msg; el.classList.add('show');
  clearTimeout(el._t); el._t = setTimeout(function() { el.classList.remove('show'); }, 2000);
}

// ─── GitHub API ──────────────────────────────────
function ghAPI(method, path, body) {
  return fetch('https://api.github.com' + path, {
    method: method,
    headers: {
      'Authorization': 'token ' + token,
      'Accept': 'application/vnd.github.v3+json',
      'Content-Type': body ? 'application/json' : undefined
    },
    body: body ? JSON.stringify(body) : undefined
  }).then(function(r) {
    if (r.status === 401) {
      localStorage.removeItem('starry_gh_token');
      token = null;
      showTokenSetup('Token 已失效，请重新输入');
      throw new Error('unauthorized');
    }
    return r.json().then(function(data) {
      if (!r.ok) throw new Error(data.message || 'API error ' + r.status);
      return data;
    });
  });
}

// ─── Load stars from GitHub ──────────────────────
function loadStars() {
  if (!token || loadingStars) return Promise.resolve();
  loadingStars = true;
  return ghAPI('GET', '/repos/' + GITHUB_USER + '/' + GITHUB_REPO + '/contents/' + STARS_FILE)
    .then(function(data) {
      fileSha = data.sha;
      var content = decodeURIComponent(escape(atob(data.content)));
      var parsed = JSON.parse(content);
      if (Array.isArray(parsed)) {
        // Merge: add remote stars we don't have locally
        var localIds = {};
        messageStars.forEach(function(s, i) { localIds[s.clientId] = i; });
        parsed.forEach(function(r) {
          if (!localIds[r.clientId]) {
            messageStars.push({
              x: r.x, y: r.y, message: r.message,
              createdAt: r.createdAt, clientId: r.clientId,
              fromRemote: true
            });
          }
        });
        // Sort by time
        messageStars.sort(function(a, b) { return a.createdAt - b.createdAt; });
        updatePanel();
      }
      loadingStars = false;
    })
    .catch(function(e) {
      loadingStars = false;
      if (e.message === 'unauthorized') return;
      // 404 = no stars.json yet, that's fine
      if (e.message && e.message.indexOf('404') === -1) {
        console.warn('Load stars failed:', e.message);
      }
    });
}

// ─── Save stars to GitHub ────────────────────────
function saveStars() {
  if (!token) return Promise.resolve();
  var toSave = messageStars.map(function(s) {
    return { x: s.x, y: s.y, message: s.message, createdAt: s.createdAt, clientId: s.clientId };
  });
  var content = btoa(unescape(encodeURIComponent(JSON.stringify(toSave, null, 2))));
  var body = { message: '✨ add a star', content: content };
  if (fileSha) body.sha = fileSha;

  return ghAPI('PUT', '/repos/' + GITHUB_USER + '/' + GITHUB_REPO + '/contents/' + STARS_FILE, body)
    .then(function(data) {
      fileSha = data.content.sha;
    })
    .catch(function(e) {
      if (e.message === 'unauthorized') return;
      // 409 = SHA conflict, re-read and retry
      if (e.message && e.message.indexOf('409') !== -1) {
        return loadStars().then(function() { return saveStars(); });
      }
      console.warn('Save stars failed:', e.message);
    });
}

// ─── Generate client ID ──────────────────────────
function genId() { return Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 8); }

// ─── Polling ─────────────────────────────────────
function startPolling() {
  stopPolling();
  pollTimer = setInterval(function() {
    if (document.hidden) return;
    var countBefore = messageStars.length;
    loadStars().then(function() {
      if (messageStars.length > countBefore) {
        showNotification('✨ 星光有更新');
      }
    });
  }, POLL_INTERVAL);
}

function stopPolling() {
  if (pollTimer) { clearInterval(pollTimer); pollTimer = null; }
}

// ─── Notification ────────────────────────────────
function showNotification(msg) {
  var el = domNotification;
  el.textContent = msg; el.style.opacity = '1';
  clearTimeout(el._t); el._t = setTimeout(function() { el.style.opacity = '0'; }, 2500);
}

// ─── Panel ───────────────────────────────────────
function updatePanel() {
  if (!domStarCards) return;
  domPanelSubtitle.textContent = '共 ' + messageStars.length + ' 颗星';
  if (messageStars.length === 0) {
    domStarCards.innerHTML = '<div class="empty">还没有星光<br>轻触天空留下第一颗吧</div>';
    return;
  }
  var sorted = messageStars.slice().reverse();
  domStarCards.innerHTML = sorted.map(function(ms) {
    var d = new Date(ms.createdAt);
    var ts = d.getFullYear() + '/' +
      String(d.getMonth()+1).padStart(2,'0') + '/' +
      String(d.getDate()).padStart(2,'0') + ' ' +
      String(d.getHours()).padStart(2,'0') + ':' +
      String(d.getMinutes()).padStart(2,'0');
    return '<div class="star-card"><div class="card-msg">✦ ' + esc(ms.message) + '</div><div class="card-time">' + ts + '</div></div>';
  }).join('');
}

// ─── Token setup UI ──────────────────────────────
function showTokenSetup(errMsg) {
  domTokenSetup.classList.add('show');
  domTokenErr.textContent = errMsg || '';
  domTokenInput.value = '';
  domBtnConnect.disabled = false;
  domBtnConnect.textContent = '✦ 连接';
  domModeBadge.textContent = '◇ 未连接';
  stopPolling();
}

function hideTokenSetup() {
  domTokenSetup.classList.remove('show');
}

function handleConnect() {
  var val = domTokenInput.value.trim();
  if (!val) { domTokenErr.textContent = '请输入 Token'; return; }
  if (!val.startsWith('ghp_') && !val.startsWith('github_pat_')) {
    domTokenErr.textContent = 'Token 格式不正确，应以 ghp_ 开头';
    return;
  }
  domBtnConnect.disabled = true;
  domBtnConnect.textContent = '连接中...';
  domTokenErr.textContent = '';

  // Test the token
  token = val;
  fetch('https://api.github.com/user', { headers: { 'Authorization': 'token ' + token } })
    .then(function(r) {
      if (!r.ok) throw new Error('bad_token');
      return r.json();
    })
    .then(function(user) {
      localStorage.setItem('starry_gh_token', token);
      hideTokenSetup();
      domModeBadge.textContent = '✦ 已连接';
      toast('已连接星空 ✨');
      return loadStars();
    })
    .then(function() { startPolling(); })
    .catch(function() {
      domTokenErr.textContent = 'Token 无效，请检查后重试';
      domBtnConnect.disabled = false;
      domBtnConnect.textContent = '✦ 连接';
      token = null;
    });
}

// ─── Add star ────────────────────────────────────
function addStar(x, y, message) {
  var star = {
    x: x, y: y,
    message: message,
    createdAt: Date.now(),
    clientId: genId(),
    fromRemote: false
  };
  messageStars.push(star);
  updatePanel();
  saveStars().catch(function() { toast('同步失败，稍后重试'); });
}

// ─── Input UI ────────────────────────────────────
function showInputAt(x, y) {
  if (!token) { toast('请先连接星空'); showTokenSetup(); return; }
  pendingX = x; pendingY = y;
  domCursor.style.left = (x * 100) + '%';
  domCursor.style.top = (y * 100) + '%';
  domCursor.classList.add('show');
  domInputBar.classList.add('active');
  domHint.style.opacity = '0';
  domMsgInput.value = '';
  domMsgInput.focus();
  showInput = true;
}

function hideInput() {
  domCursor.classList.remove('show');
  domInputBar.classList.remove('active');
  domHint.style.opacity = '1';
  showInput = false;
}

function handleSubmit() {
  var msg = domMsgInput.value.trim();
  if (!msg) return;
  addStar(pendingX, pendingY, msg);
  hideInput();
}

// ─── Popup ───────────────────────────────────────
function showPopup(star, ev) {
  domPopupMsg.textContent = star.message;
  var d = new Date(star.createdAt);
  domPopupTime.textContent = d.getFullYear() + '/' +
    String(d.getMonth()+1).padStart(2,'0') + '/' +
    String(d.getDate()).padStart(2,'0') + ' ' +
    String(d.getHours()).padStart(2,'0') + ':' +
    String(d.getMinutes()).padStart(2,'0');
  domStarPopup.style.left = ev.clientX + 'px';
  domStarPopup.style.top = ev.clientY + 'px';
  domStarPopup.classList.add('show');
}

function hidePopup() { domStarPopup.classList.remove('show'); }

function togglePanel() {
  var open = domListPanel.classList.toggle('open');
  domOverlay.classList.toggle('show', open);
  if (open) updatePanel();
}

function closePanel() {
  domListPanel.classList.remove('open');
  domOverlay.classList.remove('show');
}

// ─── Canvas interaction ──────────────────────────
function findNearestStar(cx, cy, threshold) {
  var best = null, bestDist = threshold || 0.05;
  messageStars.forEach(function(ms) {
    var d = dist(cx, cy, ms.x, ms.y);
    if (d < bestDist) { bestDist = d; best = ms; }
  });
  return best;
}

function handleCanvasClick(e) {
  if (showInput) return;
  var rect = canvas.getBoundingClientRect();
  var cx = (e.clientX - rect.left) / rect.width;
  var cy = (e.clientY - rect.top) / rect.height;
  var existing = findNearestStar(cx, cy, isMobile ? 0.06 : 0.04);
  if (existing) { showPopup(existing, e); return; }
  showInputAt(cx, cy);
}

// ─── Nebula ──────────────────────────────────────
function generateNebula() {
  nebulaPoints = [];
  var count = isMobile ? 4 : 7;
  for (var i = 0; i < count; i++) {
    nebulaPoints.push({
      x: rand(0, 1), y: rand(0.15, 0.85), r: rand(0.08, 0.22),
      hue: Math.random() < 0.6 ? rand(240, 280) : rand(180, 220),
      alpha: rand(0.015, 0.04)
    });
  }
}

function drawNebula(ctx) {
  nebulaPoints.forEach(function(n) {
    var cx = n.x * W, cy = n.y * H, r = n.r * W;
    var grad = ctx.createRadialGradient(cx, cy, 0, cx, cy, r);
    var c = 'hsla(' + n.hue + ', 60%, 50%, ' + n.alpha + ')';
    grad.addColorStop(0, c);
    grad.addColorStop(0.5, c);
    grad.addColorStop(1, 'transparent');
    ctx.fillStyle = grad;
    ctx.fillRect(cx - r, cy - r, r * 2, r * 2);
  });
}

// ─── Background stars ────────────────────────────
function starColor() {
  var r = Math.random();
  if (r < 0.6) return '#ffffff';
  if (r < 0.8) return '#d4e4ff';
  if (r < 0.92) return '#ffe8c0';
  return '#c8d8ff';
}

function generateBgStars() {
  bgStars = [];
  var count = isMobile ? 180 : 300;
  for (var i = 0; i < count; i++) {
    bgStars.push({
      x: Math.random(), y: Math.random(),
      r: rand(0.3, 2.2), phase: rand(0, Math.PI * 2),
      speed: rand(0.4, 3.5), baseAlpha: rand(0.25, 0.9),
      color: starColor()
    });
  }
  var heroCount = isMobile ? 8 : 15;
  for (var j = 0; j < heroCount; j++) {
    var idx = randInt(0, bgStars.length - 1);
    bgStars[idx].r = rand(1.8, 3.5);
    bgStars[idx].baseAlpha = rand(0.7, 1);
    bgStars[idx].speed = rand(1.5, 4);
  }
}

function drawBgStars(ctx, t) {
  bgStars.forEach(function(s) {
    var alpha = s.baseAlpha * (0.45 + 0.55 * Math.sin(s.phase + t * s.speed * 0.001));
    ctx.beginPath();
    ctx.arc(s.x * W, s.y * H, s.r, 0, Math.PI * 2);
    ctx.fillStyle = s.color;
    ctx.globalAlpha = alpha;
    ctx.fill();
  });
  ctx.globalAlpha = 1;
}

// ─── Shooting stars ──────────────────────────────
function spawnShootingStar() {
  var fromLeft = Math.random() < 0.5;
  shootingStars.push({
    x: fromLeft ? rand(0, 0.3) : rand(0.7, 1), y: rand(0.05, 0.4),
    vx: fromLeft ? rand(0.003, 0.008) : rand(-0.008, -0.003),
    vy: rand(0.001, 0.004), life: 1,
    decay: rand(0.008, 0.02), length: rand(0.04, 0.12)
  });
}

function drawShootingStars(ctx) {
  shootingStars.forEach(function(s) {
    var sx = s.x * W, sy = s.y * H;
    var ex = sx - s.vx * W * 30, ey = sy - s.vy * H * 30;
    var grad = ctx.createLinearGradient(sx, sy, ex, ey);
    grad.addColorStop(0, 'rgba(255,255,255,' + s.life + ')');
    grad.addColorStop(0.3, 'rgba(255,255,255,' + (s.life * 0.6) + ')');
    grad.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.strokeStyle = grad; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(sx, sy); ctx.lineTo(ex, ey); ctx.stroke();
    ctx.beginPath(); ctx.arc(sx, sy, 3, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(255,255,255,' + s.life + ')'; ctx.fill();
  });
}

function updateShootingStars() {
  for (var i = shootingStars.length - 1; i >= 0; i--) {
    var s = shootingStars[i];
    s.x += s.vx; s.y += s.vy; s.life -= s.decay;
    if (s.life <= 0 || s.x < -0.1 || s.x > 1.1 || s.y > 1.1) shootingStars.splice(i, 1);
  }
}

// ─── Floating particles ──────────────────────────
function generateParticles() {
  floatingParticles = [];
  var count = isMobile ? 20 : 45;
  for (var i = 0; i < count; i++) {
    floatingParticles.push({
      x: Math.random(), y: Math.random(), r: rand(0.2, 0.8),
      vx: rand(-0.0001, 0.0001), vy: rand(-0.00005, 0.00005),
      alpha: rand(0.15, 0.45), phase: rand(0, Math.PI * 2), speed: rand(0.3, 1.5)
    });
  }
}

function drawParticles(ctx, t) {
  floatingParticles.forEach(function(p) {
    p.x += p.vx + Math.sin(t * 0.0005 + p.phase) * 0.0001;
    p.y += p.vy + Math.cos(t * 0.0005 + p.phase) * 0.0001;
    if (p.x < 0) p.x = 1; if (p.x > 1) p.x = 0;
    if (p.y < 0) p.y = 1; if (p.y > 1) p.y = 0;
    var alpha = p.alpha * (0.5 + 0.5 * Math.sin(t * 0.001 * p.speed + p.phase));
    ctx.beginPath();
    ctx.arc(p.x * W, p.y * H, p.r, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(200,210,255,' + alpha + ')';
    ctx.fill();
  });
}

// ─── Message stars ───────────────────────────────
function drawMessageStars(ctx, t) {
  messageStars.forEach(function(ms) {
    var sx = ms.x * W, sy = ms.y * H;
    var age = t - ms.createdAt;
    var isNew = age < 3000;
    var scale = isNew ? 0.3 + 0.7 * (age / 3000) : 1;
    var pulse = 1 + 0.15 * Math.sin(t * 0.003 + ms.x * 10 + ms.y * 10);

    var glowR = 18 * scale * pulse;
    var glow = ctx.createRadialGradient(sx, sy, 0, sx, sy, glowR);
    glow.addColorStop(0, 'rgba(240,192,96,0.7)');
    glow.addColorStop(0.3, 'rgba(240,192,96,0.35)');
    glow.addColorStop(0.7, 'rgba(240,180,80,0.06)');
    glow.addColorStop(1, 'transparent');
    ctx.fillStyle = glow;
    ctx.beginPath(); ctx.arc(sx, sy, glowR, 0, Math.PI * 2); ctx.fill();

    var sparkLen = 8 * scale * pulse;
    ctx.strokeStyle = 'rgba(255,220,140,' + (0.6 * scale) + ')';
    ctx.lineWidth = 1.2;
    ctx.beginPath();
    ctx.moveTo(sx, sy - sparkLen); ctx.lineTo(sx, sy + sparkLen);
    ctx.moveTo(sx - sparkLen, sy); ctx.lineTo(sx + sparkLen, sy);
    ctx.stroke();

    var dLen = 4 * scale;
    ctx.strokeStyle = 'rgba(255,220,140,' + (0.3 * scale) + ')';
    ctx.lineWidth = 0.6;
    ctx.beginPath();
    ctx.moveTo(sx - dLen, sy - dLen); ctx.lineTo(sx + dLen, sy + dLen);
    ctx.moveTo(sx + dLen, sy - dLen); ctx.lineTo(sx - dLen, sy + dLen);
    ctx.stroke();

    ctx.beginPath();
    ctx.arc(sx, sy, 3.5 * scale * pulse, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(255,215,120,' + (0.9 * scale) + ')'; ctx.fill();
    ctx.beginPath();
    ctx.arc(sx, sy, 1.8 * scale * pulse, 0, Math.PI * 2);
    ctx.fillStyle = '#fff'; ctx.fill();
  });
}

// ─── Render loop ─────────────────────────────────
function render(ts) {
  time = ts;
  ctx.clearRect(0, 0, W, H);

  var skyGrad = ctx.createRadialGradient(W*0.5, H*0.3, 0, W*0.5, H*0.5, Math.max(W,H)*1.2);
  skyGrad.addColorStop(0, '#0d0d28');
  skyGrad.addColorStop(0.3, '#0a0a1f');
  skyGrad.addColorStop(0.7, '#060615');
  skyGrad.addColorStop(1, '#03030c');
  ctx.fillStyle = skyGrad;
  ctx.fillRect(0, 0, W, H);

  drawNebula(ctx);
  drawBgStars(ctx, ts);
  drawParticles(ctx, ts);
  updateShootingStars();
  drawShootingStars(ctx);
  drawMessageStars(ctx, ts);

  requestAnimationFrame(render);
}

// ─── Resize ──────────────────────────────────────
function resize() {
  W = window.innerWidth;
  H = window.innerHeight;
  canvas.width = W * dpr;
  canvas.height = H * dpr;
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  generateNebula(); generateBgStars(); generateParticles();
}

// ─── Init ────────────────────────────────────────
function init() {
  canvas = $('sky');
  ctx = canvas.getContext('2d');
  isMobile = window.innerWidth < 600 || 'ontouchstart' in window;

  // DOM refs
  domHint = $('hint');
  domCursor = $('cursorDot');
  domInputBar = $('inputBar');
  domMsgInput = $('msgInput');
  domStarPopup = $('starPopup');
  domPopupMsg = $('popupMsg');
  domPopupTime = $('popupTime');
  domListPanel = $('listPanel');
  domStarCards = $('starCards');
  domPanelSubtitle = $('panelSubtitle');
  domOverlay = $('overlay');
  domNotification = $('notification');
  domModeBadge = $('modeBadge');
  domTokenSetup = $('tokenSetup');
  domTokenInput = $('tokenInput');
  domTokenErr = $('tokenErr');
  domBtnConnect = $('btnConnect');

  resize();
  window.addEventListener('resize', function() {
    W = window.innerWidth; H = window.innerHeight;
    canvas.width = W * dpr; canvas.height = H * dpr;
    canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    generateNebula(); generateBgStars(); generateParticles();
  });

  // Check for saved token
  token = localStorage.getItem('starry_gh_token');
  if (token) {
    domModeBadge.textContent = '✦ 已连接';
    hideTokenSetup();
    loadStars().then(function() { startPolling(); });
  } else {
    showTokenSetup();
  }

  updatePanel();

  // Events
  canvas.addEventListener('click', handleCanvasClick);
  canvas.addEventListener('touchend', function(e) {
    e.preventDefault();
    if (e.changedTouches.length === 1) handleCanvasClick(e.changedTouches[0]);
  });

  $('sendBtn').addEventListener('click', handleSubmit);
  $('cancelBtn').addEventListener('click', hideInput);
  domMsgInput.addEventListener('keydown', function(e) {
    if (e.key === 'Enter') handleSubmit();
    if (e.key === 'Escape') hideInput();
  });

  $('closePopup').addEventListener('click', hidePopup);
  domStarPopup.addEventListener('click', function(e) { e.stopPropagation(); });
  document.addEventListener('click', function(e) {
    if (!domStarPopup.classList.contains('show')) return;
    if (!domStarPopup.contains(e.target)) hidePopup();
  });

  $('listBtn').addEventListener('click', togglePanel);
  $('closePanel').addEventListener('click', closePanel);
  domOverlay.addEventListener('click', closePanel);

  $('settingsBtn').addEventListener('click', showTokenSetup);
  domBtnConnect.addEventListener('click', handleConnect);
  domTokenInput.addEventListener('keydown', function(e) {
    if (e.key === 'Enter') handleConnect();
  });

  // Shooting star timer
  function scheduleShooting() {
    var delay = rand(isMobile ? 25000 : 15000, isMobile ? 70000 : 40000);
    setTimeout(function() { spawnShootingStar(); scheduleShooting(); }, delay);
  }
  scheduleShooting();

  // Start render
  requestAnimationFrame(render);
}

init();
})();
</script>
</body>
</html>
